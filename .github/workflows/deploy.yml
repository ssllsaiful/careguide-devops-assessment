name: Production Build, Publish & Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ssllsaiful/devops-task-service
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Multi-Arch Build & Registry Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (Multi-Architecture)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (Backup/Fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image_tag: sha-${{ github.sha }}
      image_name: ${{ env.REGISTRY_IMAGE }}

  deploy-and-smoke-test:
    name: Deploy to EC2 & Smoke Test with Rollback
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Evaluate Deployment Target Configuration
        id: check_deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "ssh_deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "EC2 target configured. Deployment will proceed."
          else
            echo "ssh_deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "EC2_HOST or EC2_SSH_KEY is not configured yet."
            echo "Will automatically deploy once provisioned via Terraform in Step 3."
          fi

          if [ -n "$AWS_ROLE" ]; then
            echo "oidc_auth_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "oidc_auth_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Source Code
        if: steps.check_deploy.outputs.ssh_deploy_enabled == 'true'
        uses: actions/checkout@v4

      # AWS OIDC Authentication (No long-lived access keys)
      - name: Configure AWS Credentials (OIDC)
        if: steps.check_deploy.outputs.oidc_auth_enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Container via SSH with Automated Rollback
        if: steps.check_deploy.outputs.ssh_deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_IMAGE: "${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}"
          DH_USER: "${{ secrets.DOCKERHUB_USERNAME }}"
          DH_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NEW_IMAGE,DH_USER,DH_TOKEN
          script: |
            set -euo pipefail
            echo "==> Deploying image: ${NEW_IMAGE}"

            # Log in to Docker Hub if credentials are provided
            if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
              echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            fi

            # Capture existing running image tag for rollback
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' devops-task-app 2>/dev/null || echo "")
            echo "==> Current active image: ${PREVIOUS_IMAGE:-'None (Initial Deployment)'}"

            # Pull new image
            docker pull "${NEW_IMAGE}"

            # Stop and restart container with new image
            docker stop devops-task-app 2>/dev/null || true
            docker rm -f devops-task-app 2>/dev/null || true

            docker run -d \
              --name devops-task-app \
              --restart unless-stopped \
              -p 8080:8080 \
              --log-driver=awslogs \
              --log-opt awslogs-region=us-east-1 \
              --log-opt awslogs-group=/careguide/staging/devops-task-service \
              --log-opt awslogs-stream=staging-instance \
              -e PORT=8080 \
              -e ENVIRONMENT=staging \
              -e LOG_LEVEL=INFO \
              "${NEW_IMAGE}"

            echo "==> Running smoke test against http://127.0.0.1:8080/health..."
            SMOKE_SUCCESS=0
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:8080/health > /dev/null; then
                echo "==> Smoke test PASSED on attempt $i!"
                SMOKE_SUCCESS=1
                break
              fi
              echo "Waiting for service to be healthy... (attempt $i/10)"
              sleep 3
            done

            if [ "$SMOKE_SUCCESS" -ne 1 ]; then
              echo "==> [CRITICAL] Smoke test FAILED! Triggering automated rollback..."
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "==> Rolling back to previous image: ${PREVIOUS_IMAGE}"
                docker stop devops-task-app || true
                docker rm -f devops-task-app || true
                docker run -d \
                  --name devops-task-app \
                  --restart unless-stopped \
                  -p 8080:8080 \
                  -e PORT=8080 \
                  -e ENVIRONMENT=production \
                  -e LOG_LEVEL=INFO \
                  "${PREVIOUS_IMAGE}"
                echo "==> Rollback completed. Verifying previous container health..."
                sleep 5
                curl -s -f http://127.0.0.1:8080/health
                echo "==> Rollback verified healthy."
              else
                echo "==> No previous image available to rollback."
              fi
              exit 1
            fi

            echo "==> Deployment and verification successfully completed!"
