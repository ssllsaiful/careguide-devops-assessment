name: Pull Request CI & Security Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Linting & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Black Formatter Check
        run: black --check --line-length 100 app tests

      - name: Run Flake8 Linter
        run: flake8 app tests --max-line-length=100

      - name: Execute Unit Tests with Coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  lint-docker-and-scripts:
    name: Dockerfile & Shell Script Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint Shell Scripts with ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          severity: warning
        continue-on-error: true # Will be strictly enforced once scripts/ directory is populated

  security-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint-and-test, lint-docker-and-scripts]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: careguide/devops-task-service:scan-pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: careguide/devops-task-service:scan-pr-${{ github.event.pull_request.number }}
          format: "table"
          exit-code: "1" # Fail pipeline on CRITICAL vulnerabilities
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
