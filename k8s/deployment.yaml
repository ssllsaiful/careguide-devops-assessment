apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-service
  labels:
    app: devops-task-service
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-task-service
  template:
    metadata:
      labels:
        app: devops-task-service
        tier: backend
    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web-service
          image: ssllsaiful/devops-task-service:1.0.0
          imagePullPolicy: IfNotPresent

          # Container-level strict security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Resource allocation and limits
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          # Health Probes
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Environment variables mapped from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: devops-task-config
            - secretRef:
                name: devops-task-secret

          # Writable volume mount to support readOnlyRootFilesystem
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}
