global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  # 1. Microservice Application Metrics
  - job_name: "devops-task-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["devops-task-app:8080"]
        labels:
          service: "devops-task-service"
          environment: "local-monitoring"

  # 2. Host System Metrics (Node Exporter)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: "host-metrics"

  # 3. Container Resource Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          role: "container-metrics"
